<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic Meta -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A magical birthday surprise for Summi.">

    <meta
        name="theme-color"
        content="#050816">

    <title>Happy Birthday Summi 🎉</title>

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="./css/style.css">

</head>

<body>

    <!-- ======================================
         APPLICATION
    ======================================= -->

    <div class="app">

        <!-- Background -->

        <div id="background-layer"></div>

        <!-- Loader -->

        <section
            id="loader"
            class="scene">

            <div class="container">

                <div class="content">

                    <!-- Magic Star -->

                    <div class="loader-star"></div>

                    <!-- Loader Title -->

                    <h2 class="loader-title">

                        Preparing Something Special...

                    </h2>

                    <!-- Loader Subtitle -->

                    <p class="loader-subtitle">

                        A magical birthday surprise is on its way.

                    </p>

                </div>

            </div>

        </section>

        <!-- Hero -->

        <section
            id="hero"
            class="scene hidden">

        </section>

        <!-- Gift -->

        <section
            id="gift"
            class="scene hidden">

        </section>

        <!-- Message -->

        <section
            id="message"
            class="scene hidden">

        </section>

        <!-- Wish -->

        <section
            id="wish"
            class="scene hidden">

        </section>

        <!-- Cake -->

        <section
            id="cake"
            class="scene hidden">

        </section>

        <!-- Fireworks -->

        <section
            id="fireworks"
            class="scene hidden">

        </section>

        <!-- Ending -->

        <section
            id="ending"
            class="scene hidden">

        </section>

        <!-- Music Toggle -->

        <button
            id="music-toggle"
            class="btn btn-secondary hidden"
            aria-label="Toggle music">

            🎵

        </button>

        <!-- Canvas -->

        <canvas id="effects-canvas"></canvas>

    </div>

    <!-- JavaScript -->

    <script
        type="module"
        src="./js/main.js">

    </script>

</body>

</html>
